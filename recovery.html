<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>学汉字 — Reset Password</title>
<script src="shared/supabase-client.js"></script>
<script src="strings.js"></script>
<script src="nav.js"></script>
<link rel="stylesheet" href="shared/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700;800&family=ZCOOL+KuaiLe&family=Nunito:wght@400;700;800&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
    --theme-color:       var(--botes-ochre);
    --theme-color-light: #D4A57433;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: 'Bai Jamjuree', sans-serif;
    background: var(--paper-cream);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
}
.page-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
}
.recovery-card {
    background: var(--paper-warm);
    background-image: url('assets/textures/paper-grain.png');
    background-blend-mode: multiply;
    border-radius: 20px;
    padding: 32px 24px 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: var(--shadow-lifted);
    text-align: center;
}
.recovery-icon { font-size: 3rem; margin-bottom: 8px; }
.recovery-title {
    font-size: 1.15em; font-weight: 800;
    color: var(--ink-dark); margin-bottom: 4px;
}
.recovery-sub {
    font-size: 0.78em; color: var(--ink-soft);
    margin-bottom: 20px; line-height: 1.5;
}
.form-group {
    margin-bottom: 14px;
    text-align: left;
}
.form-group label {
    display: block; font-size: 0.72em;
    font-weight: bold; color: var(--ink-soft);
    margin-bottom: 4px; text-transform: uppercase;
    letter-spacing: 0.5px;
}
.password-wrap {
    position: relative;
}
.password-wrap input {
    width: 100%; padding: 10px 40px 10px 12px;
    border: 2px solid var(--paper-deep);
    border-radius: 10px; font-size: 0.88em;
    font-family: inherit;
    background: var(--paper-cool);
    color: var(--ink-dark);
    outline: none;
    transition: border-color 0.2s;
}
.password-wrap input:focus {
    border-color: var(--botes-ochre);
}
.password-toggle {
    position: absolute;
    right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none;
    cursor: pointer; font-size: 1.1em;
    color: var(--ink-light); padding: 4px;
    line-height: 1;
}
.password-toggle:hover { color: var(--ink-soft); }
.strength-bar {
    height: 4px; border-radius: 2px;
    margin-top: 6px; background: var(--paper-deep);
    overflow: hidden; transition: all 0.2s;
}
.strength-bar .fill {
    height: 100%; border-radius: 2px;
    width: 0; transition: width 0.3s, background 0.3s;
}
.strength-label {
    font-size: 0.6em; color: var(--ink-light);
    margin-top: 3px; text-align: right;
    min-height: 16px;
}
.submit-btn {
    width: 100%; padding: 12px; margin-top: 6px;
    background: var(--botes-ochre); color: white;
    border: none; border-radius: 12px;
    font-size: 0.92em; font-weight: 800;
    cursor: pointer; font-family: inherit;
    transition: background 0.2s;
}
.submit-btn:hover:not(:disabled) { background: var(--botes-ochre-deep); }
.submit-btn:disabled { opacity: 0.6; cursor: default; }
.error-msg {
    background: var(--danger-bg);
    color: var(--danger);
    border-radius: 10px; padding: 8px 12px;
    font-size: 0.72em; margin-bottom: 12px;
    display: none; line-height: 1.4;
}
.loading-spinner {
    width: 40px; height: 40px;
    border: 4px solid var(--botes-ochre-deep);
    border-top-color: var(--botes-ochre);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 20px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
.hidden { display: none !important; }
.success-note {
    font-size: 0.78em; color: var(--botes-sage);
    font-weight: bold; margin-top: 10px;
    padding: 8px 12px;
    background: #E8F5E9; border-radius: 8px;
    line-height: 1.4;
}
.back-link {
    display: inline-block; margin-top: 16px;
    font-size: 0.78em; color: var(--botes-ochre);
    text-decoration: underline; cursor: pointer;
}
@media (max-width: 480px) {
    .recovery-card { padding: 24px 16px 20px; }
}
</style>
</head>
<body>
<div id="app-nav"></div>
<div class="page-content">
<div class="recovery-card" id="recovery-card">

    <!-- LOADING -->
    <div id="view-loading">
        <div class="recovery-icon">🔐</div>
        <div class="recovery-title" data-i18n="set_new_password_title"></div>
        <div class="loading-spinner"></div>
        <p style="font-size:0.75em;color:var(--ink-light);" data-i18n="recovery_verifying"></p>
    </div>

    <!-- SET PASSWORD FORM -->
    <div id="view-form" class="hidden">
        <div class="recovery-icon">🔑</div>
        <div class="recovery-title" data-i18n="set_new_password_title"></div>
        <div class="recovery-sub" data-i18n="set_new_password_sub"></div>
        <div class="error-msg" id="error-msg"></div>
        <form id="password-form" novalidate>
            <div class="form-group">
                <label data-i18n="upgrade_password_label"></label>
                <div class="password-wrap">
                    <input type="password" id="pass" name="password" autocomplete="new-password" minlength="6" data-i18n-placeholder="upgrade_password_ph" required />
                    <button type="button" class="password-toggle" id="pass-toggle" onclick="togglePass()" tabindex="-1">👁️</button>
                </div>
                <div class="strength-bar" id="strength-bar"><div class="fill" id="strength-fill"></div></div>
                <div class="strength-label" id="strength-label"></div>
            </div>
            <div class="form-group">
                <label data-i18n="upgrade_confirm_label"></label>
                <div class="password-wrap">
                    <input type="password" id="pass-confirm" name="confirm" autocomplete="new-password" minlength="6" data-i18n-placeholder="upgrade_password_ph" required />
                    <button type="button" class="password-toggle" id="pass-confirm-toggle" onclick="togglePassConfirm()" tabindex="-1">👁️</button>
                </div>
            </div>
            <button type="submit" class="submit-btn" id="submit-btn"><span data-i18n="set_new_password_submit"></span></button>
        </form>
        <a class="back-link" href="index.html" data-i18n="reset_password_back"></a>
    </div>

    <!-- SUCCESS -->
    <div id="view-success" class="hidden">
        <div class="recovery-icon" style="font-size:3.5rem;">✅</div>
        <div class="recovery-title" data-i18n="set_new_password_success_title"></div>
        <div class="recovery-sub" data-i18n="set_new_password_success_body"></div>
        <div id="pin-cleared-note" class="hidden success-note" data-i18n="pin_was_cleared"></div>
        <button class="submit-btn" onclick="window.location.href='index.html'"><span data-i18n="set_new_password_continue"></span></button>
    </div>

    <!-- NO RECOVERY -->
    <div id="view-no-recovery" class="hidden">
        <div class="recovery-icon">🔍</div>
        <div class="recovery-title" data-i18n="set_new_password_title"></div>
        <p class="recovery-sub" id="no-recovery-msg"></p>
        <a class="back-link" href="index.html" data-i18n="set_new_password_continue"></a>
    </div>

</div>
</div>

<script>
(function() {
    'use strict';

    var passInput = document.getElementById('pass');
    var passConfirm = document.getElementById('pass-confirm');
    var form = document.getElementById('password-form');
    var errorEl = document.getElementById('error-msg');
    var submitBtn = document.getElementById('submit-btn');
    var hasRecovery = false;
    var resolved = false;

    /* ── Show one view, hide others ── */
    function showView(id) {
        ['view-loading', 'view-form', 'view-success', 'view-no-recovery'].forEach(function(v) {
            var el = document.getElementById(v);
            if (el) el.classList.toggle('hidden', v !== id);
        });
    }

    /* ── Password visibility toggles ── */
    window.togglePass = function() {
        var inp = document.getElementById('pass');
        var btn = document.getElementById('pass-toggle');
        if (inp.type === 'password') {
            inp.type = 'text';
            btn.textContent = '🙈';
        } else {
            inp.type = 'password';
            btn.textContent = '👁️';
        }
    };

    window.togglePassConfirm = function() {
        var inp = document.getElementById('pass-confirm');
        var btn = document.getElementById('pass-confirm-toggle');
        if (inp.type === 'password') {
            inp.type = 'text';
            btn.textContent = '🙈';
        } else {
            inp.type = 'password';
            btn.textContent = '👁️';
        }
    };

    /* ── Password strength meter ── */
    function updateStrength() {
        var val = passInput.value || '';
        var fill = document.getElementById('strength-fill');
        var label = document.getElementById('strength-label');
        var score = 0;

        if (val.length >= 6) score += 1;
        if (val.length >= 10) score += 1;
        if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score += 1;
        if (/[0-9]/.test(val)) score += 1;
        if (/[^a-zA-Z0-9]/.test(val)) score += 1;

        var pct = (score / 5) * 100;
        var colors = ['#D32F2F', '#FF7043', '#FFA726', '#66BB6A', '#43A047'];
        var labels = [
            typeof t === 'function' ? t('password_strength_weak') : 'Weak',
            typeof t === 'function' ? t('password_strength_fair') : 'Fair',
            typeof t === 'function' ? t('password_strength_good') : 'Good',
            typeof t === 'function' ? t('password_strength_strong') : 'Strong',
            typeof t === 'function' ? t('password_strength_very_strong') : 'Very Strong'
        ];

        fill.style.width = pct + '%';
        fill.style.background = colors[Math.min(score, 4)];
        label.textContent = score > 0 ? labels[Math.min(score - 1, 4)] : '';
    }

    passInput.addEventListener('input', updateStrength);
    passConfirm.addEventListener('input', function() {
        var match = passConfirm.value.length > 0 && passConfirm.value === passInput.value;
        passConfirm.style.borderColor = match ? 'var(--botes-sage)' : '';
    });

    /* ── Form submission ── */
    form.addEventListener('submit', function(e) {
        e.preventDefault();

        var password = passInput.value || '';
        var confirm = passConfirm.value || '';
        var errMsg = '';

        if (password.length < 6) {
            errMsg = typeof t === 'function' ? t('auth_error_password') : 'Password must be at least 6 characters.';
        } else if (password !== confirm) {
            errMsg = typeof t === 'function' ? t('auth_error_confirm') : 'Passwords do not match.';
        }

        if (errMsg) {
            errorEl.textContent = errMsg;
            errorEl.style.display = 'block';
            return;
        }

        errorEl.style.display = 'none';
        submitBtn.disabled = true;
        submitBtn.querySelector('span').textContent =
            typeof t === 'function' ? t('set_new_password_submitting') : 'Updating...';

        doUpdatePassword(password)
            .then(function() {
                // Check if parent PIN should be cleared
                try {
                    if (localStorage.getItem('xhz_pin_reset_pending') === 'true') {
                        localStorage.removeItem('xhz_parent_pin');
                        localStorage.removeItem('xhz_pin_reset_pending');
                        document.getElementById('pin-cleared-note').classList.remove('hidden');
                    }
                } catch(e) {}
                resolved = true;
                showView('view-success');
                if (typeof refreshStrings === 'function') refreshStrings();
            })
            .catch(function(err) {
                errorEl.textContent = err.message || (typeof t === 'function' ? t('auth_error_generic') : 'Something went wrong. Please try again.');
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.querySelector('span').textContent =
                    typeof t === 'function' ? t('set_new_password_submit') : 'Update Password';
            });
    });

    function doUpdatePassword(newPassword) {
        if (typeof window.__supabaseUpdatePassword === 'function') {
            return window.__supabaseUpdatePassword(newPassword);
        }
        return Promise.reject(new Error('Supabase auth not available'));
    }

    /* ── Detect recovery flow ── */
    function detectRecovery() {
        // Check if URL hash contains type=recovery
        if (window.location.hash.indexOf('type=recovery') !== -1) {
            hasRecovery = true;
        }

        // Also check the flag set by supabase-client.js
        if (window.__supabaseIsRecovery) {
            hasRecovery = true;
        }

        // Wait for Supabase to be ready
        var waitFor = window.__supabaseReady || Promise.resolve();

        Promise.race([
            waitFor,
            new Promise(function(_, reject) {
                setTimeout(reject, 8000);
            })
        ]).then(function() {
            if (hasRecovery || window.__supabaseIsRecovery) {
                // Recovery detected — show the form
                showView('view-form');
                if (typeof refreshStrings === 'function') refreshStrings();
            } else {
                // No recovery — show message
                document.getElementById('no-recovery-msg').textContent =
                    typeof t === 'function' ? t('recovery_invalid_link') : 'This link is not a valid password reset request. Please request a new reset email.';
                showView('view-no-recovery');
                if (typeof refreshStrings === 'function') refreshStrings();
            }
        }).catch(function() {
            // Timed out waiting for Supabase — check hash directly as fallback
            if (window.location.hash.indexOf('type=recovery') !== -1) {
                showView('view-form');
                if (typeof refreshStrings === 'function') refreshStrings();
            } else {
                document.getElementById('no-recovery-msg').textContent =
                    typeof t === 'function' ? t('recovery_verify_failed') : 'Could not verify this link. Please request a new password reset email.';
                showView('view-no-recovery');
                if (typeof refreshStrings === 'function') refreshStrings();
            }
        });
    }

    /* ── Init ── */
    function init() {
        initNav('recovery');
        // Set default text for no-recovery message
        document.getElementById('no-recovery-msg').textContent =
            typeof t === 'function' ? t('recovery_no_request') : 'No password reset request detected.';
        if (typeof refreshStrings === 'function') refreshStrings();
        // Start recovery detection after a small delay to let supabase-client initialize
        setTimeout(detectRecovery, 800);
    }

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
    } else {
        document.addEventListener('DOMContentLoaded', init);
    }
})();
</script>
</body>
</html>
