name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./games
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build games
        run: npm run build

      - name: Prepare deployment
        # Override the job-level working-directory: ./games by using explicit workspace path
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p deployment
          # Copy all tracked files from the repo root into deployment
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='deployment' . deployment/
          # Remove .gitignore files so upload-pages-artifact doesn't filter out dist/
          find deployment -name '.gitignore' -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deployment

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
