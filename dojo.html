<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dojo · 学汉字</title>
<script src="nav.js"></script>
<script src="profiles.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="shared/supabase-sync.js"></script>
<script src="strings.js"></script>
<link rel="stylesheet" href="shared/design-system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@400;600;700;800&family=ZCOOL+KuaiLe&family=Nunito:wght@400;700;800&family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="games/dist/assets/index.css">
<style>
/* ── DOJO PAGE — Neo-Brutalism Board-Game Aesthetic ── */

/* ── LAYOUT ── */
#main-content { flex: 1; padding: 12px 12px 80px; }

/* ── DOJO HEADER ── */
.dojo-header {
  text-align: center;
  padding: 24px 12px 20px;
}
.dojo-header h1 {
  font-family: 'ZCOOL KuaiLe', 'Bai Jamjuree', sans-serif;
  font-size: 2rem;
  color: #111827;
  margin-bottom: 4px;
  font-weight: 900;
  letter-spacing: -0.03em;
  text-shadow: 3px 3px 0px rgba(30, 64, 175, 0.12);
}
.dojo-header h1 span { font-size: 2rem; }
.dojo-header p {
  font-size: 0.9rem;
  color: #6B5544;
  margin: 0;
  font-weight: 700;
}

/* ── GAME CARDS — 3-column grid ── */
.games-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 24px;
  padding: 0 8px;
  max-width: 520px;
  margin-left: auto;
  margin-right: auto;
}

.game-card {
  background: #FAF8F5;
  border: 3px solid #111827;
  border-radius: 18px;
  padding: 16px 10px 14px;
  text-align: center;
  cursor: pointer;
  transition: all 0.12s ease;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  position: relative;
  overflow: hidden;
  box-shadow: 4px 4px 0px 0px #111827;
  min-width: 0;
}
.game-card:hover {
  transform: translateY(-3px);
  box-shadow: 4px 7px 0px 0px #111827;
}
.game-card:active {
  transform: translateY(1px);
  box-shadow: 1px 1px 0px 0px #111827;
}
.game-card.selected {
  transform: translateY(-2px);
  box-shadow: 4px 6px 0px 0px #111827;
  border-color: #1E40AF;
  background: #F0F4FF;
}

/* Per-game color accent stripe at top */
.game-card[data-game="sushi"]::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: #FF6B35;
  z-index: 1;
}
.game-card[data-game="matching"]::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 4px;
  background: #7E57C2;
  z-index: 1;
}

.game-card-icon {
  font-size: 2.2rem;
  line-height: 1;
  filter: drop-shadow(2px 2px 0px rgba(17, 24, 39, 0.15));
  max-width: 100%;
}

.game-card-title {
  font-size: 0.82rem;
  font-weight: 800;
  color: #111827;
  letter-spacing: -0.02em;
  word-break: break-word;
  overflow-wrap: break-word;
  max-width: 100%;
}

.game-card.disabled {
  opacity: 0.55;
  cursor: default;
  pointer-events: none;
  filter: grayscale(0.6);
}
.game-card.disabled::before {
  background: #9CA3AF !important;
}

.game-card-highscore {
  margin-top: auto;
  padding-top: 6px;
  font-size: 0.68rem;
  color: #6B5544;
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 700;
  max-width: 100%;
}
.game-card-highscore .score-value {
  font-weight: 800;
  color: #1E40AF;
  font-size: 0.78rem;
}

.game-card-play {
  margin-top: 4px;
  background: #FCD34D;
  color: #111827;
  border: 2.5px solid #111827;
  border-radius: 10px;
  padding: 5px 14px;
  font-size: 0.72rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.12s ease;
  box-shadow: 2px 2px 0px 0px #111827;
  font-family: inherit;
  max-width: 100%;
  box-sizing: border-box;
}
.game-card-play:hover {
  transform: translateY(-2px);
  box-shadow: 2px 4px 0px 0px #111827;
}
.game-card-play:active {
  transform: translateY(1px);
  box-shadow: 0px 0px 0px 0px #111827;
}

/* Game selection description area */
.game-selection-info {
  display: none;
  text-align: center;
  padding: 10px 16px 14px;
  margin: -16px auto 20px;
  max-width: 480px;
  font-size: 0.85rem;
  color: #6B5544;
  font-weight: 700;
  line-height: 1.5;
}
.game-selection-info.visible {
  display: block;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Inline game container */
#dojo-game-root {
  background: #FAF8F5;
  border: 3px solid #111827;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 12px;
  display: none;
  box-shadow: 5px 5px 0px 0px #111827;
}
#dojo-game-root.visible { display: block; }

.game-back-bar {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
  background: #FCD34D;
  border-bottom: 3px solid #111827;
}
.game-back-btn {
  background: none;
  border: 3px solid #111827;
  font-size: 0.85rem;
  color: #111827;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  border-radius: 10px;
  font-weight: 700;
  transition: all 0.1s ease;
  box-shadow: 2px 2px 0px 0px #111827;
  font-family: inherit;
}
.game-back-btn:hover {
  transform: translateY(-2px);
  box-shadow: 2px 4px 0px 0px #111827;
  background: white;
}
.game-back-btn:active {
  transform: translateY(1px);
  box-shadow: 0px 0px 0px 0px #111827;
}

/* ── HALL TABS ── */
.hall-tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  justify-content: center;
}

.hall-tab {
  border: 3px solid #111827;
  background: white;
  border-radius: 12px;
  padding: 8px 18px;
  font-size: 0.8rem;
  font-weight: 800;
  cursor: pointer;
  transition: all 0.12s ease;
  box-shadow: 3px 3px 0px 0px #111827;
  font-family: inherit;
  color: #111827;
  flex: 1;
  max-width: 200px;
  text-align: center;
}

.hall-tab:hover {
  transform: translateY(-2px);
  box-shadow: 3px 5px 0px 0px #111827;
}

.hall-tab:active {
  transform: translateY(1px);
  box-shadow: 1px 1px 0px 0px #111827;
}

.hall-tab.active {
  background: #FCD34D;
  border-color: #111827;
  box-shadow: 3px 3px 0px 0px #111827;
}

.hall-tab.active:hover {
  transform: translateY(-2px);
  box-shadow: 3px 5px 0px 0px #111827;
}

/* Loading spinner */
.hall-loading {
  text-align: center;
  padding: 30px 0;
  font-size: 1.2rem;
  color: #9CA3AF;
  font-weight: 700;
}

.hall-loading::after {
  content: '';
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-left: 8px;
  border: 3px solid #D1D5DB;
  border-top-color: #111827;
  border-radius: 50%;
  animation: hallSpin 0.8s linear infinite;
  vertical-align: middle;
}

@keyframes hallSpin {
  to { transform: rotate(360deg); }
}

/* ── HALL OF FAME — Neo-Brutalism Board ── */
.hall {
  background: #FAF8F5;
  border-radius: 20px;
  border: 4px solid #111827;
  padding: 24px;
  box-shadow: 8px 8px 0px 0px #111827;
  max-width: 600px;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
}

/* Decorative corner brackets */
.hall::before,
.hall::after {
  content: '';
  position: absolute;
  width: 40px;
  height: 40px;
  border: 3px solid #FCD34D;
  opacity: 0.5;
  border-radius: 4px;
  pointer-events: none;
}
.hall::before {
  top: 8px;
  left: 8px;
  border-right: none;
  border-bottom: none;
}
.hall::after {
  bottom: 8px;
  right: 8px;
  border-left: none;
  border-top: none;
}

.hall-header {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 20px;
  position: relative;
}
.hall-header h2 {
  font-family: 'ZCOOL KuaiLe', 'Bai Jamjuree', sans-serif;
  font-size: 1.35rem;
  color: #111827;
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 900;
  letter-spacing: -0.02em;
  text-shadow: 2px 2px 0px rgba(30, 64, 175, 0.1);
}
.hall-header h2 span { font-size: 1.6rem; }

/* Decorative line under header */
.hall-header::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 20%;
  right: 20%;
  height: 3px;
  background: #111827;
  border-radius: 2px;
}

.hall-list { display: grid; gap: 10px; }

/* ---- Achievement Card ---- */
.hall-item {
  display: grid;
  grid-template-columns: 48px 38px 1fr auto;
  align-items: center;
  gap: 10px;
  border-radius: 14px;
  padding: 10px 14px;
  background: #FAF8F5;
  border: 3px solid #111827;
  box-shadow: 3px 3px 0px 0px #111827;
  transition: all 0.12s ease;
  position: relative;
  overflow: hidden;
  animation: hallEntry 0.5s ease both;
}
.hall-item:hover {
  transform: translateY(-2px);
  box-shadow: 3px 5px 0px 0px #111827;
}
.hall-item:active {
  transform: translateY(1px);
  box-shadow: 1px 1px 0px 0px #111827;
}

@keyframes hallEntry {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* ---- Podium styling for top 3 (achievement cards) ---- */
.hall-item.podium {
  padding: 14px 18px;
}
.hall-item.podium-1 {
  background: linear-gradient(135deg, #FFF9E6, #FFF3CC);
  border-color: #E6B800;
  box-shadow: 4px 4px 0px 0px #111827;
}
.hall-item.podium-2 {
  background: linear-gradient(135deg, #F0F2F5, #E4E7EB);
  border-color: #9CA3AF;
  box-shadow: 4px 4px 0px 0px #111827;
}
.hall-item.podium-3 {
  background: linear-gradient(135deg, #FDF0E6, #FCE4D4);
  border-color: #CD8D5E;
  box-shadow: 4px 4px 0px 0px #111827;
}

/* Thick accent stripe on left for podium */
.hall-item.podium::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 6px;
  height: 100%;
}
.hall-item.podium-1::before { background: linear-gradient(180deg, #FFD700, #E6B800); }
.hall-item.podium-2::before { background: linear-gradient(180deg, #CDD5E0, #9CA3AF); }
.hall-item.podium-3::before { background: linear-gradient(180deg, #E8A86A, #CD8D5E); }

/* Rank badge — metallic medal with 3px border */
.hall-rank {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  font-weight: 900;
  background: #E5E7EB;
  color: #9CA3AF;
  flex-shrink: 0;
  border: 3px solid #111827;
  box-shadow: 2px 2px 0px 0px #111827;
}
.hall-rank.gold {
  background: linear-gradient(135deg, #FFD700, #E6B800);
  color: #fff;
  border-color: #111827;
  box-shadow: 2px 2px 0px 0px #111827;
  text-shadow: 1px 1px 0px rgba(0,0,0,0.2);
}
.hall-rank.silver {
  background: linear-gradient(135deg, #D0D8E0, #B0B8C4);
  color: #fff;
  border-color: #111827;
  box-shadow: 2px 2px 0px 0px #111827;
  text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
}
.hall-rank.bronze {
  background: linear-gradient(135deg, #E8A86A, #CD8D5E);
  color: #fff;
  border-color: #111827;
  box-shadow: 2px 2px 0px 0px #111827;
  text-shadow: 1px 1px 0px rgba(0,0,0,0.15);
}

.hall-item.podium .hall-rank {
  width: 50px;
  height: 50px;
  font-size: 1.4rem;
}

/* Avatar */
.hall-avatar {
  font-size: 1.6rem;
  text-align: center;
  flex-shrink: 0;
  filter: drop-shadow(1px 1px 0px rgba(17, 24, 39, 0.15));
}
.hall-item.podium .hall-avatar {
  font-size: 2rem;
}

/* Meta info */
.hall-meta {
  line-height: 1.4;
  min-width: 0;
}
.hall-meta .hall-game-icon {
  font-size: 0.9rem;
  margin-right: 4px;
  display: inline-block;
}
.hall-meta .hall-name {
  display: block;
  font-size: 1.1rem;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #111827;
}

.hall-meta .hall-sub {
  font-size: 0.72rem;
  color: #6B5544;
  margin-top: 2px;
  font-weight: 700;
}

/* Highlight current user in global rankings */
.hall-item.you {
  border-color: #FCD34D;
  background: #FFFDE7;
}

/* Score display */
.hall-score {
  text-align: right;
  white-space: nowrap;
  flex-shrink: 0;
}
.hall-score .score-stars {
  font-size: 0.88rem;
  color: #1E40AF;
  font-weight: 900;
}
.hall-score .score-points {
  display: block;
  font-size: 0.75rem;
  color: #6B5544;
  font-weight: 700;
  margin-top: 1px;
}
.hall-score .score-points b {
  font-size: 0.9rem;
  color: #F43F5E;
}

/* Empty state */
.hall-empty {
  color: #9CA3AF;
  font-size: 0.9rem;
  text-align: center;
  padding: 30px 0;
  line-height: 1.6;
  font-weight: 700;
}

/* Game icon badges set by JS */



/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .games-grid {
    gap: 6px;
    padding: 0 4px;
  }
  .game-card {
    padding: 10px 4px 8px;
    border-width: 2px;
    border-radius: 12px;
    box-shadow: 2px 2px 0px 0px #111827;
    gap: 3px;
  }
  .game-card-icon { font-size: 1.6rem; }
  .game-card-title {
    font-size: 0.65rem;
    word-break: break-word;
    overflow-wrap: break-word;
    hyphens: auto;
  }
  .game-card-highscore { font-size: 0.55rem; padding-top: 3px; gap: 2px; }
  .game-card-highscore .score-value { font-size: 0.65rem; }
  .game-card-play { font-size: 0.6rem; padding: 3px 8px; border-width: 2px; }
  
  .hall { padding: 16px; box-shadow: 6px 6px 0px 0px #111827; }
  .hall-item { grid-template-columns: 36px 30px 1fr auto; gap: 8px; padding: 8px 10px; }
  .hall-rank { width: 34px; height: 34px; font-size: 0.9rem; }
  .hall-item.podium .hall-rank { width: 42px; height: 42px; font-size: 1.2rem; }
  .hall-avatar { font-size: 1.3rem; }
  .hall-meta .hall-name { font-size: 0.82rem; }
}
</style>
</head>
<body>
  <div id="page-wrap">
    <div id="app-nav"></div>
    <main id="main-content">

      <!-- DOJO HEADER -->
      <div class="dojo-header">
        <h1><span>🥋</span> Dojo</h1>
        <p>Choose your challenge and master Chinese characters!</p>
      </div>

      <!-- GAME CARDS -->
      <div class="games-grid" id="games-grid"></div>

      <!-- GAME SELECTION DESCRIPTION -->
      <div class="game-selection-info" id="game-selection-info"></div>

      <!-- INLINE GAME CONTAINER (for sushi mode) -->
      <div class="game-back-bar" id="game-back-bar" style="display:none;">
        <button class="game-back-btn" onclick="closeGame()">← Back to Dojo</button>
      </div>
      <div id="dojo-game-root"></div>

      <!-- HALL OF FAME -->
      <section class="hall">
        <div class="hall-header">
          <h2><span>🏆</span> Hall of Fame</h2>
        </div>

        <div class="hall-tabs">
          <button class="hall-tab active" data-tab="local" onclick="switchHallTab('local')">📋 Your Rankings</button>
          <button class="hall-tab" data-tab="global" onclick="switchHallTab('global')">🌍 Global Rankings</button>
        </div>

        <div id="hall-list" class="hall-list"></div>
      </section>

    </main>
  </div>

  <script type="module" src="games/dist/assets/game.js?v=37"></script>

  <script>
    /* =====================================================
       GAME DEFINITIONS
    ===================================================== */
    var GAMES = [
      {
        id: 'sushi',
        icon: '🍣',
        title: 'Sushi Conveyor',
        desc: 'Drag & drop characters to hungry customers on the conveyor belt!',
        color: '#FF6B35',
        inline: true,
        route: null
      },
      {
        id: 'matching',
        icon: '⚡',
        title: 'Flash Match',
        desc: 'Race against time — match characters to meanings at lightning speed!',
        color: '#7E57C2',
        inline: true,
        route: null
      },
      {
        id: 'coming',
        icon: '🎮',
        title: 'Coming Soon',
        desc: 'A new game is on its way — stay tuned!',
        color: '#9CA3AF',
        inline: false,
        route: null,
        disabled: true
      },
    ];

    /* =====================================================
       RENDER GAME CARDS
    ===================================================== */
    var SELECTED_GAME = null;

    function showGameDescription(gameId) {
      var infoEl = document.getElementById('game-selection-info');
      var game = GAMES.find(function(g) { return g.id === gameId; });
      if (game && game.desc) {
        infoEl.innerHTML = '<span style="font-size:1.1rem;margin-right:4px;">' + game.icon + '</span> ' + game.desc;
        infoEl.classList.add('visible');
      } else {
        infoEl.classList.remove('visible');
      }
    }

    function selectGame(gameId) {
      var game = GAMES.find(function(g) { return g.id === gameId; });
      if (!game || game.disabled) return;

      // Update selected state
      SELECTED_GAME = gameId;
      var cards = document.querySelectorAll('.game-card');
      cards.forEach(function(c) {
        c.classList.toggle('selected', c.getAttribute('data-game') === gameId);
      });

      showGameDescription(gameId);
    }

    function renderGameCards() {
      var grid = document.getElementById('games-grid');
      grid.innerHTML = '';

      GAMES.forEach(function(game) {
        var card = document.createElement('a');
        card.className = 'game-card';
        if (game.disabled) card.classList.add('disabled');
        card.href = 'javascript:void(0)';
        card.style.setProperty('--theme-color', game.color);
        card.setAttribute('data-game', game.id);

        // Get high score for this game
        var highScore = getGameHighScore(game.id);

        card.innerHTML =
          '<div class="game-card-icon">' + game.icon + '</div>' +
          '<div class="game-card-title">' + game.title + '</div>' +
          (highScore !== null
            ? '<div class="game-card-highscore">⭐ Best: <span class="score-value">' + highScore + '</span></div>'
            : '<div class="game-card-highscore" style="color:var(--ink-light);font-size:0.68rem;">No record yet</div>') +
          (game.disabled
            ? '<div class="game-card-play" style="background:#D1D5DB;cursor:default;opacity:0.6;">🔒</div>'
            : '<div class="game-card-play" style="background:' + game.color + ';">▶ Play</div>');

        card.onclick = function(e) {
          e.preventDefault();
          if (game.disabled) return;
          // If already selected, open the game; otherwise select it
          if (SELECTED_GAME === game.id) {
            openGame(game.id);
          } else {
            selectGame(game.id);
          }
        };

        // Also handle Play button clicks via delegation
        var playBtn = card.querySelector('.game-card-play');
        if (playBtn && !game.disabled) {
          playBtn.onclick = function(e) {
            e.stopPropagation();
            e.preventDefault();
            openGame(game.id);
          };
        }

        grid.appendChild(card);
      });

      // Restore selection if any
      if (SELECTED_GAME) {
        var selectedCards = document.querySelectorAll('.game-card[data-game="' + SELECTED_GAME + '"]');
        selectedCards.forEach(function(c) { c.classList.add('selected'); });
        showGameDescription(SELECTED_GAME);
      }
    }

    /* =====================================================
       GET HIGH SCORE FOR A GAME
       Reads from profiles.js score data
    ===================================================== */
    function getGameHighScore(gameId) {
      var profile = XHZ.getActiveProfile();
      if (!profile) return null;

      var allScores = XHZ.getAllScores(profile.id);
      var best = null;

      Object.values(allScores).forEach(function(day) {
        // Check for game-specific scores stored in the day entry
        if (day.game_scores && day.game_scores[gameId]) {
          var score = day.game_scores[gameId];
          if (best === null || score > best) best = score;
        }
      });

      // Also check the dojo hall of fame — iterate ALL entries to find the highest score
      try {
        var hof = JSON.parse(localStorage.getItem('xhz_dojo_hall_of_fame') || '[]');
        for (var j = 0; j < hof.length; j++) {
          var e = hof[j];
          if (e.profileId === profile.id && e.gameId === gameId) {
            if (best === null || e.bestScore > best) {
              best = e.bestScore;
            }
          }
        }
      } catch(_) {}

      return best;
    }

    /* =====================================================
       OPEN / CLOSE INLINE GAME
    ===================================================== */
    function openGame(gameId) {
      var root = document.getElementById('dojo-game-root');
      var backBar = document.getElementById('game-back-bar');
      root.classList.add('visible');
      if (backBar) backBar.style.display = 'flex';
      root.scrollIntoView({ behavior: 'smooth', block: 'start' });

      // Clear selection description
      var infoEl = document.getElementById('game-selection-info');
      if (infoEl) infoEl.classList.remove('visible');

      // Dispatch event for the game module to mount
      window.dispatchEvent(new CustomEvent('xhz:mount-game', {
        detail: { gameId: gameId }
      }));
    }

    function closeGame() {
      var root = document.getElementById('dojo-game-root');
      var backBar = document.getElementById('game-back-bar');
      root.classList.remove('visible');
      if (backBar) backBar.style.display = 'none';

      // Dispatch event to unmount
      window.dispatchEvent(new CustomEvent('xhz:unmount-game'));
    }

    /* =====================================================
       HALL OF FAME — Tab switching + Local & Global rankings
    ===================================================== */
    var CURRENT_HALL_TAB = 'local';

    function switchHallTab(tab) {
      CURRENT_HALL_TAB = tab;
      // Update tab button active state
      document.querySelectorAll('.hall-tab').forEach(function(btn) {
        btn.classList.toggle('active', btn.getAttribute('data-tab') === tab);
      });
      renderHallOfFame();
    }

    function formatDate(ts) {
      var d = new Date(ts);
      var month = d.getMonth() + 1;
      var day = d.getDate();
      var hours = d.getHours();
      var minutes = d.getMinutes();
      var ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      return month + '/' + day + ' ' + hours + ':' + minutes + ' ' + ampm;
    }

    function renderGameLeaderboard(gameId, maxRank) {
      var entries = [];
      try {
        entries = JSON.parse(localStorage.getItem('xhz_dojo_hall_of_fame') || '[]');
      } catch (_) {
        entries = [];
      }

      // Filter by gameId
      var filtered = entries.filter(function(e) { return e.gameId === gameId; });

      // Sort by score descending
      var sorted = filtered.slice().sort(function(a, b) {
        if (b.bestScore !== a.bestScore) return b.bestScore - a.bestScore;
        if (b.bestStars !== a.bestStars) return b.bestStars - a.bestStars;
        return b.updatedAt - a.updatedAt;
      });

      if (sorted.length === 0) {
        return '<div class="hall-empty">No ' + (gameId === 'sushi' ? 'Sushi' : 'Flash') + ' records yet</div>';
      }

      var count = Math.min(maxRank, sorted.length);
      var html = '';

      for (var i = 0; i < count; i++) {
        var entry = sorted[i];
        var rank = i + 1;

        var itemClass = 'hall-item';
        var rankClass = 'hall-rank';
        var rankLabel = '#' + rank;

        if (rank === 1) {
          itemClass += ' podium podium-1';
          rankClass += ' gold';
          rankLabel = '🥇';
        } else if (rank === 2) {
          itemClass += ' podium podium-2';
          rankClass += ' silver';
          rankLabel = '🥈';
        } else if (rank === 3) {
          itemClass += ' podium podium-3';
          rankClass += ' bronze';
          rankLabel = '🥉';
        }

        var animDelay = (i * 0.06) + 's';

        html +=
          '<div class="' + itemClass + '" data-game="' + gameId + '" style="animation-delay:' + animDelay + '">' +
            '<div class="' + rankClass + '">' + rankLabel + '</div>' +
            '<div class="hall-avatar">' + (entry.avatar || '🐼') + '</div>' +
            '<div class="hall-meta">' +
              '<span class="hall-name">' + escapeHtml(entry.nickname) + '</span>' +
              '<div class="hall-sub">' +
                'Stage ' + entry.bestStage + ' · ' + formatDate(entry.updatedAt) +
              '</div>' +
            '</div>' +
            '<div class="hall-score">' +
              '<span class="score-stars">' + entry.bestStars + ' ⭐</span>' +
              '<span class="score-points">Score <b>' + entry.bestScore + '</b></span>' +
            '</div>' +
          '</div>';
      }

      return html;
    }

    function renderLocalHallOfFame() {
      var listEl = document.getElementById('hall-list');
      var sushiHtml = renderGameLeaderboard('sushi', 5);
      var matchingHtml = renderGameLeaderboard('matching', 5);

      listEl.innerHTML =
        '<div>' +
          '<div class="section-label" style="font-size:0.85rem;font-weight:800;margin-bottom:10px;text-align:center;">🍣 Sushi Conveyor</div>' +
          sushiHtml +
        '</div>' +
        '<div style="border-top:2px dashed #D1D5DB;margin:14px 0;"></div>' +
        '<div>' +
          '<div class="section-label" style="font-size:0.85rem;font-weight:800;margin-bottom:10px;text-align:center;">⚡ Flash Match</div>' +
          matchingHtml +
        '</div>';
    }

    function renderGlobalLeaderboard(gameId, maxRank) {
      if (!window.__GLOBAL_HOF || !window.__GLOBAL_HOF.length) {
        return '<div class="hall-empty">🌍 No global rankings yet<br><span style="font-size:0.8rem;color:#9CA3AF;">Play a game and your score will appear here for everyone to see!</span></div>';
      }

      var filtered = window.__GLOBAL_HOF.filter(function(e) { return e.gameId === gameId; });
      var sorted = filtered.slice().sort(function(a, b) {
        if (b.bestScore !== a.bestScore) return b.bestScore - a.bestScore;
        if (b.bestStars !== a.bestStars) return b.bestStars - a.bestStars;
        return b.updatedAt - a.updatedAt;
      });

      if (sorted.length === 0) {
        return '<div class="hall-empty">No ' + (gameId === 'sushi' ? 'Sushi' : 'Flash') + ' global records yet</div>';
      }

      var count = Math.min(maxRank, sorted.length);
      var html = '';

      for (var i = 0; i < count; i++) {
        var entry = sorted[i];
        var rank = i + 1;

        var itemClass = 'hall-item';
        var rankClass = 'hall-rank';
        var rankLabel = '#' + rank;

        if (rank === 1) {
          itemClass += ' podium podium-1';
          rankClass += ' gold';
          rankLabel = '🥇';
        } else if (rank === 2) {
          itemClass += ' podium podium-2';
          rankClass += ' silver';
          rankLabel = '🥈';
        } else if (rank === 3) {
          itemClass += ' podium podium-3';
          rankClass += ' bronze';
          rankLabel = '🥉';
        }

        // Highlight current user's entry
        var profile = XHZ.getActiveProfile();
        var isYou = profile && entry.profileId === profile.id;

        var animDelay = (i * 0.06) + 's';
        var youClass = isYou ? ' you' : '';

        html +=
          '<div class="' + itemClass + youClass + '" style="animation-delay:' + animDelay + '">' +
            '<div class="' + rankClass + '">' + rankLabel + '</div>' +
            '<div class="hall-avatar">' + (entry.avatar || '🐼') + '</div>' +
            '<div class="hall-meta">' +
              '<span class="hall-name">' + escapeHtml(entry.nickname) + (isYou ? ' <span style="font-size:0.7rem;color:#9CA3AF;">(you)</span>' : '') + '</span>' +
              '<div class="hall-sub">' +
                'Stage ' + entry.bestStage + ' · ' + formatDate(entry.updatedAt) +
              '</div>' +
            '</div>' +
            '<div class="hall-score">' +
              '<span class="score-stars">' + entry.bestStars + ' ⭐</span>' +
              '<span class="score-points">Score <b>' + entry.bestScore + '</b></span>' +
            '</div>' +
          '</div>';
      }

      return html;
    }

    function renderGlobalHallOfFame() {
      var listEl = document.getElementById('hall-list');

      // Show loading state
      listEl.innerHTML = '<div class="hall-loading">Loading global rankings...</div>';

      function guard() {
        // If the user switched tabs while we were fetching, don't render
        if (CURRENT_HALL_TAB !== 'global') return true;
        return false;
      }

      if (window.__SUPABASE_SYNC && window.__SUPABASE_SYNC.ready) {
        window.__SUPABASE_SYNC.pullHallOfFameEntries().then(function(entries) {
          if (guard()) return;
          window.__GLOBAL_HOF = entries || [];
          renderGlobalHallOfFameContent();
        }).catch(function() {
          if (guard()) return;
          window.__GLOBAL_HOF = [];
          renderGlobalHallOfFameContent();
        });
      } else {
        // SYNC not ready - check if Supabase is available directly
        var sb = window.__supabase;
        if (sb) {
          sb.from('hall_of_fame')
            .select('*')
            .order('best_score', { ascending: false })
            .limit(100)
            .then(function(result) {
              if (guard()) return;
              if (result.error) {
                window.__GLOBAL_HOF = [];
              } else if (result.data) {
                window.__GLOBAL_HOF = result.data.map(function(row) {
                  return {
                    sessionId: row.session_id,
                    profileId: row.profile_id,
                    gameId: row.game_id,
                    nickname: row.nickname,
                    avatar: row.avatar || '🐼',
                    bestStars: row.best_stars || 0,
                    bestScore: row.best_score || 0,
                    bestStage: row.best_stage || 0,
                    updatedAt: row.updated_at
                  };
                });
              } else {
                window.__GLOBAL_HOF = [];
              }
              renderGlobalHallOfFameContent();
            }).catch(function() {
              if (guard()) return;
              window.__GLOBAL_HOF = [];
              renderGlobalHallOfFameContent();
            });
        } else {
          window.__GLOBAL_HOF = [];
          renderGlobalHallOfFameContent();
        }
      }
    }

    function renderGlobalHallOfFameContent() {
      var listEl = document.getElementById('hall-list');
      var sushiHtml = renderGlobalLeaderboard('sushi', 5);
      var matchingHtml = renderGlobalLeaderboard('matching', 5);

      listEl.innerHTML =
        '<div>' +
          '<div class="section-label" style="font-size:0.85rem;font-weight:800;margin-bottom:10px;text-align:center;">🍣 Sushi Conveyor — Global</div>' +
          sushiHtml +
        '</div>' +
        '<div style="border-top:2px dashed #D1D5DB;margin:14px 0;"></div>' +
        '<div>' +
          '<div class="section-label" style="font-size:0.85rem;font-weight:800;margin-bottom:10px;text-align:center;">⚡ Flash Match — Global</div>' +
          matchingHtml +
        '</div>';
    }

    function renderHallOfFame() {
      if (CURRENT_HALL_TAB === 'global') {
        renderGlobalHallOfFame();
      } else {
        renderLocalHallOfFame();
      }
    }


    /* =====================================================
       UTILITY
    ===================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '"');
    }




    /* =====================================================
       INIT
    ===================================================== */
    document.addEventListener('DOMContentLoaded', function() {

      XHZ.requireActive();
      initNav('dojo');
      renderGameCards();
      renderHallOfFame();

      onLangChange(function() {
        renderHallOfFame();
        window.dispatchEvent(new CustomEvent('xhz:lang-changed'));
      });

      window.addEventListener('xhz:dojo-hof-updated', function() {
        renderHallOfFame();
        renderGameCards();
        // If on Global tab, retry after a delay to let Supabase catch up
        if (CURRENT_HALL_TAB === 'global') {
          setTimeout(function() {
            if (CURRENT_HALL_TAB === 'global') {
              renderGlobalHallOfFame();
            }
          }, 2000);
        }
      });

      // Re-render Global tab when push to Supabase completes
      window.addEventListener('xhz:dojo-hof-pushed', function() {
        if (CURRENT_HALL_TAB === 'global') {
          renderGlobalHallOfFame();
        }
      });
    });
  </script>
</body>
</html>
