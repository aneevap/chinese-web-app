/* ── SETTINGS PANEL ── */
function showSettings() {
    _modalMode = 'settings';

    // Show panel immediately with current session state
    renderSettingsPanel(window.__supabaseIsAnon === false);

    // __supabaseIsAnon defaults to `true` and gets updated asynchronously
    // when Supabase restores the session. If it's still `true` but Supabase
    // hasn't finished init yet, wait and re-check once ready.
    if (window.__supabaseIsAnon === true && window.__supabaseReady) {
        window.__supabaseReady.then(function () {
            if (window.__supabaseIsAnon === false) {
                var container = document.getElementById('create-account-btn-container');
                if (container) container.style.display = 'none';
            }
        }).catch(function () {});
    }
}

function renderSettingsPanel(isSignedIn) {
    var accountRow = isSignedIn
        ? '<div class="settings-account-row">' +
          '<span style="font-size:1.1em;">📧</span>' +
          '<span class="email">' + (window.__supabaseEmail || '') + '</span>' +
          '<button class="settings-signout-btn" onclick="doSignOut()" data-i18n="sign_out"></button>' +
          '</div>'
        : '<div id="create-account-btn-container">' +
          '<button class="settings-btn settings-btn-accent" ' +
          'onclick="showAuthModal(\'upgrade\')">' +
          '<span data-i18n="create_account"></span>' +
          '</button></div>';

    renderModalBox(
        '<button class="modal-close" onclick="closeParentModal()">✕</button>' +
        '<div class="modal-title" data-i18n="settings_title"></div>' +

        accountRow +

        '<button class="settings-btn" onclick="showManageProfiles()">' +
        '<span data-i18n="manage_profiles"></span>' +
        '</button>' +

        '<button class="settings-btn" onclick="showChangePinPanel()">' +
        '<span data-i18n="change_pin"></span>' +
        '</button>' +

        '<button class="settings-btn" onclick="closeParentModal()" data-i18n="close"></button>' +
        '<div style="text-align:center;padding-top:12px; border-top:1px solid var(--paper-deep); margin-top:4px;">' +'<p style="font-size:0.7em;color:var(--ink-light);margin-bottom:8px;line-height:1.5;">' +
'Made with ☕ by one developer</p>' +'<a href="https://ko-fi.com/D1D41XCDKQ" target="_blank">' +'<img height="30" style="border:0;height:30px;" ' +
'src="https://storage.ko-fi.com/cdn/kofi6.png?v=6" alt="Buy Me a Coffee at ko-fi.com"/>' +
'</a></div>'
    );
    refreshStrings();
}

function doSignOut() {
    if (typeof window.__supabaseSignOut === 'function') {
        window.__supabaseSignOut().then(function () {
            closeParentModal();
            window.location.reload();
        }).catch(function (err) {
            console.error('Sign out error:', err);
        });
    }
}

/* ── MANAGE PROFILES ── */
function showManageProfiles() {
    _modalMode = 'manage';
    var profiles = XHZ.getAllProfiles();
    var listHTML = '';

    if (!profiles.length) {
        listHTML = '<p class="pin-tip" data-i18n="no_learners"></p>';
    } else {
        listHTML = '<div class="settings-profile-list">' +
            profiles.map(function(p) {
                return '<div class="settings-profile-row">' +
                    '<span class="settings-profile-name">' +
                        p.avatar + ' ' + p.nickname +
                        (p.is_guest ? ' <span style="font-size:0.8em;color:var(--ink-light);">(guest)</span>' : '') +
                    '</span>' +
                    '<button class="settings-del-btn" ' +
                        'onclick="confirmDelete(\'' + p.id + '\')">' +
                        '🗑 Delete' +
                    '</button>' +
                '</div>';
            }).join('') +
        '</div>';
    }

    renderModalBox(
        '<button class="modal-close" onclick="showSettings()">←</button>' +
        '<div class="modal-title" data-i18n="manage_profiles"></div>' +
        listHTML +
        '<button class="settings-btn" onclick="showSettings()" data-i18n="close"></button>'
    );
    refreshStrings();
}

/* ── CONFIRM DELETE ── */
function confirmDelete(profileId) {
    _deleteTarget = profileId;
    var p = XHZ.getProfile(profileId);
    if (!p) return;

    renderModalBox(
        '<button class="modal-close" onclick="showManageProfiles()">←</button>' +
        '<div class="modal-title" data-i18n="are_you_sure"></div>' +
        '<p class="confirm-text">' +
            '<span class="confirm-name">' + p.avatar + ' ' + p.nickname + '</span><br/>' +
            '<span data-i18n="delete_warning"></span>' +
        '</p>' +
        '<div class="confirm-btns">' +
            '<button class="btn-cancel-del" onclick="showManageProfiles()" data-i18n="cancel"></button>' +
            '<button class="btn-confirm-del" onclick="doDeleteProfile()" data-i18n="delete"></button>' +
        '</div>'
    );
    refreshStrings();
}

function doDeleteProfile() {
    if (!_deleteTarget) return;
    var wasActive = (XHZ.getActiveId() === _deleteTarget);
    XHZ.deleteProfile(_deleteTarget);
    _deleteTarget = null;
    if (wasActive) {
        XHZ.clearActive();
        window.location.href = 'index.html';
    } else {
        showManageProfiles();
    }
}

/* ── CHANGE PIN ── */
function showChangePinPanel() {
    _modalMode = 'change-pin';
    _pinBuffer = '';
    renderModalBox(
        '<button class="modal-close" onclick="showSettings()">←</button>' +
        '<div class="modal-title" data-i18n="change_pin"></div>' +
        '<p class="new-pin-label">Enter a new 4-digit PIN</p>' +
        '<div class="pin-dots" id="pin-dots">' + pinDotsHTML(0) + '</div>' +
        '<div class="pin-error" id="pin-error"></div>' +
        '<div class="pin-keypad">' + pinKeypadHTML() + '</div>'
    );
    refreshStrings();
}

/* ── PIN HELPERS ── */
function pinDotsHTML(filled) {
    var h = '';
    for (var i = 0; i < 4; i++) {
        h += '<div class="pin-dot' + (i < filled ? ' filled' : '') + '"></div>';
    }
    return h;
}

function pinKeypadHTML() {
    var keys = [1,2,3,4,5,6,7,8,9,'',0,'⌫'];
    return keys.map(function(k) {
        if (k === '') return '<div></div>';
        var cls = k === '⌫' ? 'pin-key delete' : 'pin-key';
        return '<button class="' + cls + '" onclick="pinPress(\'' + k + '\')">' + k + '</button>';
    }).join('');
}

function pinPress(key) {
    if (key === '⌫') {
        _pinBuffer = _pinBuffer.slice(0, -1);
    } else {
        if (_pinBuffer.length >= 4) return;
        _pinBuffer += String(key);
    }

    var dotsEl = document.getElementById('pin-dots');
    if (dotsEl) dotsEl.innerHTML = pinDotsHTML(_pinBuffer.length);

    if (_pinBuffer.length === 4) {
        setTimeout(function() { handlePinComplete(); }, 120);
    }
}

function handlePinComplete() {
    var stored = localStorage.getItem('xhz_parent_pin');

    if (_modalMode === 'pin-entry') {
        if (_pinBuffer === stored) {
            showSettings();
        } else {
            _pinBuffer = '';
            var dotsEl = document.getElementById('pin-dots');
            var errEl  = document.getElementById('pin-error');
            if (dotsEl) dotsEl.innerHTML = pinDotsHTML(0);
            if (errEl)  errEl.textContent = t('pin_wrong');
        }
        return;
    }

    if (_modalMode === 'pin-setup' || _modalMode === 'change-pin') {
        localStorage.setItem('xhz_parent_pin', _pinBuffer);
        _pinBuffer = '';
        showSettings();
        /* brief confirmation toast */
        showToast(t('pin_saved'));
        return;
    }
}

/* ── RENDER HELPER ── */
function renderModalBox(html) {
    document.getElementById('modal-box').innerHTML = html;
}

/* ── TOAST ── */
var _toastTimer = null;
function showToast(msg) {
    var existing = document.getElementById('progress-toast');
    if (existing) existing.remove();

    var toast = document.createElement('div');
    toast.id = 'progress-toast';
    toast.textContent = msg;
    toast.style.cssText = [
        'position:fixed',
        'bottom:80px',
        'left:50%',
        'transform:translateX(-50%)',
        'background:var(--ink-dark)',
        'color:var(--paper-cream)',
        'padding:10px 20px',
        'border-radius:20px',
        'font-size:0.85em',
        'font-weight:bold',
        'z-index:9999',
        'box-shadow:var(--shadow-card)',
        'opacity:0',
        'transition:opacity 0.2s'
    ].join(';');

    document.body.appendChild(toast);
    requestAnimationFrame(function() {
        toast.style.opacity = '1';
    });

    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function() {
        toast.style.opacity = '0';
        setTimeout(function() { toast.remove(); }, 250);
    }, 2000);
}

/* =====================================================
   8. NOTEBOOK
===================================================== */
function renderNotebook() {
    var notebook = XHZ.getNotebook(profile.id);
    var entries = Object.values(notebook);
    var countEl = document.getElementById('notebook-count');
    var emptyEl = document.getElementById('notebook-empty');
    var listEl = document.getElementById('notebook-list');

    if (countEl) countEl.textContent = entries.length ? '(' + entries.length + ')' : '';

    if (!entries.length) {
        if (emptyEl) emptyEl.style.display = '';
        if (listEl) listEl.style.display = 'none';
        return;
    }

    if (emptyEl) emptyEl.style.display = 'none';
    if (listEl) listEl.style.display = '';

    // Sort by most recently added first
    entries.sort(function (a, b) {
        return (b.added_at || '').localeCompare(a.added_at || '');
    });

    // Show only first 5 in compact view
    var showCount = Math.min(5, entries.length);
    var compactEntries = entries.slice(0, showCount);

    listEl.innerHTML = '<div class="nb-compact">' +
        compactEntries.map(function (e) {
            var dateStr = e.added_at ? e.added_at.slice(0, 10) : '';
            var nbLang  = typeof getNavLang === 'function' ? getNavLang() : 'en';
            var courseWord = nbLang === 'th' && !e.meaning_th ? findInCourseData(e.word_id) : null;
            var nbMeaning = nbLang === 'th'
                ? (e.meaning_th || (courseWord && courseWord.th) || e.meaning)
                : e.meaning;
            return '<div class="nb-compact-entry">' +
                '<div class="cce-char">' + escapeHtml(e.char) + '</div>' +
                '<div class="cce-info">' +
                    '<div class="cce-py">' + escapeHtml(e.pinyin) + '</div>' +
                    '<div class="cce-meaning">' + escapeHtml(nbMeaning) + '</div>' +
                '</div>' +
                (dateStr ? '<div class="cce-date">' + dateStr + '</div>' : '') +
            '</div>';
        }).join('') +
        (entries.length > 5
            ? '<button class="nb-see-all" onclick="openNotebookSheet()">' + tFormat('notebook_see_all', { count: entries.length }) + '</button>'
            : '') +
    '</div>';
}

/* ── NOTEBOOK BOTTOM SHEET ── */
function openNotebookSheet() {
    var overlay = document.getElementById('nb-sheet-overlay');
    overlay.classList.add('open');
    document.getElementById('nb-sheet-title').textContent = t('notebook_sheet_title');
    renderFullNotebook();
    // Focus for keyboard events (escape to close)
    setTimeout(function() { overlay.focus(); }, 100);
}

function closeNotebookSheet() {
    document.getElementById('nb-sheet-overlay').classList.remove('open');
    document.getElementById('nb-sheet-body').innerHTML = '';
}

// Close notebook sheet on escape key
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && document.getElementById('nb-sheet-overlay').classList.contains('open')) {
        closeNotebookSheet();
    }
});

function renderFullNotebook() {
    var notebook = XHZ.getNotebook(profile.id);
    var entries = Object.values(notebook);
    var bodyEl = document.getElementById('nb-sheet-body');

    if (!entries.length) {
        bodyEl.innerHTML = '<div class="nb-empty">' + t('notebook_empty') + '</div>';
        return;
    }

    // Sort by most recently added first
    entries.sort(function (a, b) {
        return (b.added_at || '').localeCompare(a.added_at || '');
    });

    var addNoteLabel = t('notebook_add_note');
    var nbLang  = typeof getNavLang === 'function' ? getNavLang() : 'en';
    bodyEl.innerHTML = entries.map(function (e) {
        var courseWord = nbLang === 'th' && !e.meaning_th ? findInCourseData(e.word_id) : null;
        var nbMeaning = nbLang === 'th'
            ? (e.meaning_th || (courseWord && courseWord.th) || e.meaning)
            : e.meaning;
        var noteHtml = e.note
            ? '<div class="nb-note-display" onclick="editSheetNotebookNote(\'' + e.word_id + '\')" id="nb-sheet-display-' + e.word_id + '">' + escapeHtml(e.note) + '</div>'
            : '<div class="nb-note-display empty" onclick="editSheetNotebookNote(\'' + e.word_id + '\')" id="nb-sheet-display-' + e.word_id + '">' + addNoteLabel + '</div>';

        return '<div class="nb-entry" id="nb-sheet-entry-' + e.word_id + '">' +
            '<div class="nb-char">' + escapeHtml(e.char) + '</div>' +
            '<div class="nb-info">' +
                '<div class="nb-py">' + escapeHtml(e.pinyin) + '</div>' +
                '<div class="nb-meaning">' + escapeHtml(nbMeaning) + '</div>' +
                '<div id="nb-sheet-note-row-' + e.word_id + '">' +
                    noteHtml +
                '</div>' +
                '<div class="nb-date">📅 ' + (e.added_at || '') + '</div>' +
            '</div>' +
            '<div class="nb-actions">' +
                '<button class="nb-btn nb-btn-edit" onclick="editSheetNotebookNote(\'' + e.word_id + '\')" title="Edit note">✏️</button>' +
                '<button class="nb-btn nb-btn-del" onclick="removeSheetNotebookEntry(\'' + e.word_id + '\')" title="Remove from notebook">🗑️</button>' +
            '</div>' +
        '</div>';
    }).join('');
}

var _notebookEditing = {};

function editSheetNotebookNote(wordId) {
    if (_notebookEditing[wordId]) return;
    _notebookEditing[wordId] = true;

    var notebook = XHZ.getNotebook(profile.id);
    var entry = notebook[wordId];
    if (!entry) return;

    var row = document.getElementById('nb-sheet-note-row-' + wordId);
    if (!row) return;

    row.innerHTML = '<div class="nb-note-area">' +
        '<input class="nb-note-input" id="nb-sheet-input-' + wordId + '" type="text" maxlength="200" ' +
        'value="' + escapeHtml(entry.note || '') + '" placeholder="' + t('notebook_note_placeholder') + '" />' +
        '<button class="nb-btn nb-btn-save" onclick="saveSheetNotebookNote(\'' + wordId + '\')">✓</button>' +
        '</div>';

    var input = document.getElementById('nb-sheet-input-' + wordId);
    if (input) {
        input.focus();
        input.select();
    }
}

function saveSheetNotebookNote(wordId) {
    var input = document.getElementById('nb-sheet-input-' + wordId);
    if (!input) return;
    var note = input.value.trim();
    XHZ.updateNotebookNote(wordId, note);
    _notebookEditing[wordId] = false;
    renderFullNotebook();
}

function removeSheetNotebookEntry(wordId) {
    if (!confirm(t('notebook_remove_confirm'))) return;
    XHZ.removeNotebookEntry(wordId);
    renderFullNotebook();
    renderNotebook();
}

/* ── Look up a word's data (including Thai translation) from loaded course data ── */
function findInCourseData(wordId) {
    if (!COURSE_DATA) return null;
    var cids = Object.keys(COURSE_DATA);
    for (var i = 0; i < cids.length; i++) {
        var data = COURSE_DATA[cids[i]];
        if (data && data.words) {
            for (var j = 0; j < data.words.length; j++) {
                if (data.words[j].word_id === wordId) return data.words[j];
            }
        }
    }
    return null;
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}
</script>
